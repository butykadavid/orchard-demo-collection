<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dark Souls III Randomizer Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>⚰️ Dark Souls III Randomizer Tracker</h1>
            <p class="subtitle">Map fog gate connections for your challenge run</p>
        </header>

        <div class="controls">
            <div class="input-group">
                <input type="text" id="areaInput" placeholder="Enter zone name (e.g., High Wall, Undead Settlement)" />
                <button onclick="addElement()">Add Zone</button>
            </div>
            <button class="secondary-btn" onclick="saveToFile()">💾 Save</button>
            <button class="secondary-btn" onclick="loadFromFile()">📂 Load</button>
            <button class="secondary-btn" onclick="clearAll()">Clear All</button>
        </div>

        <div class="canvas" id="canvas">
            <svg id="connectionSvg"></svg>
        </div>

        <div class="status-bar">
            Zones: <span id="zoneCount">0</span> | Connections: <span id="connectionCount">0</span> | 
            <span id="status">Click zones to connect them</span>
        </div>
    </div>

    <input type="file" id="fileInput" class="hidden-file-input" accept=".json" />
    <script src="script.js"></script>
</body>
</html>
